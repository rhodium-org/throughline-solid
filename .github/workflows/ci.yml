name: ci

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install throughline
        run: pip install throughline

      # Not --strict: every item here is permanently proposed by design (NG-0001),
      # so an unratified finding is the intended state. Structural findings are
      # errors under plain check and still fail the gate.
      - name: Grounding gate (the graph must stay sound)
        run: tl check

      - name: Docs freshness gate (docs/spec.md must match the graph)
        run: tl docs --check
